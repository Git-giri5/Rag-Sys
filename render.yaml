services:
  - type: web
    name: rag-qa-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CHROMA_DIR
        value: /app/data/chroma
      - key: UPLOAD_DIR
        value: /app/data/uploads
